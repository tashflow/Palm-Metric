  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #1A3C2F;
      color: #F5F0E6;
      font-family: "Noto Sans Arabic", "Montserrat", sans-serif;
    }
    [dir="ltr"] body {
      font-family: "Montserrat", "Noto Sans Arabic", sans-serif;
    }
    .font-en { font-family: "Montserrat", sans-serif; }
    .font-ar { font-family: "Noto Sans Arabic", sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes mascotFloat {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg) scale(1); }
      50% { transform: translateY(-10px) rotate(2deg) scale(1.02); }
    }
    .animate-mascot {
      animation: mascotFloat 4.2s ease-in-out infinite;
      will-change: transform;
    }
    .palm-card {
      background: linear-gradient(180deg, #FAF6EE 0%, #F5F0E6 100%);
      color: #1A3C2F;
      border: 1.5px solid #E8DFCC;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 7px 0 #CDBE9F, 0 18px 32px -10px rgba(5, 16, 12, 0.55);
    }
    .palm-btn-gold {
      background: linear-gradient(180deg, #D5B038 0%, #C9A227 100%);
      color: #142A20;
      box-shadow: inset 0 1px 0 rgba(255,248,220,0.45), 0 4px 0 #947210;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .palm-btn-gold:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #947210;
    }
    .palm-btn-forest {
      background: linear-gradient(180deg, #214B3B 0%, #1A3C2F 100%);
      color: #F5F0E6;
      box-shadow: 0 4px 0 #0D2119;
    }
    .palm-cart-bar {
      background: linear-gradient(180deg, #D8B43C 0%, #C9A227 100%);
      color: #142A20;
      box-shadow: 0 6px 0 #947210, 0 22px 40px -6px rgba(4, 14, 10, 0.68);
    }
  </style>
</head>

        accounts: JSON.parse(localStorage.getItem('pm_accounts') || '[]'),
        sessionId: localStorage.getItem('pm_session') || null,
        orderType: 'pickup',
        guest: { name: '', phone: '', address: '' },
        notes: '',
        loc: null,
        locError: '',
        locLoading: false,
        formError: '',
        accTab: 'login',
        accError: ''
      };

      function getUser() {
        return state.accounts.find(a => a.id === state.sessionId) || null;
      }

      function save() {
        localStorage.setItem('pm_lang', state.lang);
        localStorage.setItem('pm_cart', JSON.stringify(state.cart));
        localStorage.setItem('pm_accounts', JSON.stringify(state.accounts));
        if (state.sessionId) localStorage.setItem('pm_session', state.sessionId);
        else localStorage.removeItem('pm_session');
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function buildWaUrl() {
        const user = getUser();
        const isAr = state.lang === 'ar';
        const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
        const lines = ['🌴 *Palm Metric | بالم مترك*', '---------------------------'];
        lines.push(state.orderType === 'pickup'
          ? (isAr ? 'نوع الطلب: Pickup (استلام من الفرع)' : 'Order Type: Pickup')
          : (isAr ? 'نوع الطلب: Delivery (توصيل)' : 'Order Type: Delivery'));
        lines.push('');
        lines.push(isAr ? '*الطلبات:*' : '*Items:*');
        state.cart.forEach(i => {
          const tempLabel = i.temp ? (i.temp === 'hot' ? ' (Hot / حار)' : ' (Cold / بارد)') : '';
          lines.push(`• ${i.qty}x ${isAr ? i.ar : i.en}${tempLabel} — ${i.price * i.qty} ﷼`);
        });
        lines.push('');
        lines.push(isAr ? `*الإجمالي: ${total} ﷼*` : `*Total: ${total} ﷼*`);
        if (state.orderType === 'delivery') {
          const n = user ? user.name : state.guest.name.trim();
          const p = user ? user.phone : state.guest.phone.trim();
          const a = user ? user.address : state.guest.address.trim();
          const mapLoc = state.loc || (user && user.loc);
          lines.push('');
          lines.push(isAr ? '*بيانات التوصيل:*' : '*Delivery Details:*');
          lines.push(`${isAr ? 'الاسم' : 'Name'}: ${n}`);
          lines.push(`${isAr ? 'الجوال' : 'Phone'}: ${p}`);
          lines.push(`${isAr ? 'العنوان' : 'Address'}: ${a}`);
          if (state.notes.trim()) lines.push(`${isAr ? 'ملاحظات' : 'Notes'}: ${state.notes.trim()}`);
          if (mapLoc) lines.push(`${isAr ? 'موقع الخريطة' : 'Google Maps'}: https://www.google.com/maps/search/?api=1&query=${mapLoc.lat},${mapLoc.lng}`);
          lines.push('');
          lines.push('💵 Cash on delivery / الدفع عند الاستلام');
        } else if (state.notes.trim()) {
          lines.push('');
          lines.push(`${isAr ? 'ملاحظات' : 'Notes'}: ${state.notes.trim()}`);
        }
        return `https://wa.me/${BUSINESS.whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`;

              </div>

                    <section>

                      </div>

                                <div class="flex items-start justify-between gap-3">

                                    <button data-temp="${item.id}:cold" class="flex-1 min-h-[38px] rounded-xl text-xs font-bold ${temp === 'cold' ? 'bg-[#1A3C2F] text-[#C9A227]' : 'bg-[#E6DEC8] text-[#3B594B]'}">${t.cold}</button>
                                  </div>` : ''}
                              </div>
                              <div class="mt-4 pt-3 border-t border-[#1A3C2F]/10">
                                ${qty === 0
                                  ? `<button data-add="${item.id}" class="palm-btn-gold w-full min-h-[44px] rounded-xl text-sm font-extrabold">+ ${t.add}</button>`
                                  : `<div class="flex items-center justify-between rounded-xl bg-[#1A3C2F] p-1 text-[#F5F0E6]">
                                      <button data-qty="${key}:-1" class="h-10 w-11 rounded-lg bg-[#254E3E] font-bold">-</button>
                                      <span class="font-en text-sm font-extrabold text-[#C9A227] tabular-nums">${qty}</span>
                                      <button data-qty="${key}:1" class="h-10 w-11 rounded-lg bg-[#C9A227] text-[#142A20] font-extrabold">+</button>
                                    </div>`}
                              </div>
                            </article>`;
                        }).join('')}
                      </div>
                    </section>`;
                }).join('')}
              </div>
            </div>`;
        } else if (state.view === 'checkout') {
          const mapLoc = state.loc || (user && user.loc);
          const mapUrl = mapLoc ? `https://www.google.com/maps/search/?api=1&query=${mapLoc.lat},${mapLoc.lng}` : '';
          bodyHtml = `
            <div class="mx-auto max-w-3xl px-4 pt-6 pb-16 sm:px-6 space-y-5">
              <div class="flex items-center justify-between">
                <button data-nav="menu" class="min-h-[44px] rounded-xl bg-[#234A3B] px-4 py-2 text-sm font-bold text-[#F5F0E6]">${t.back}</button>
                <h1 class="text-xl sm:text-2xl font-extrabold text-[#F5F0E6]">${t.checkout}</h1>
              </div>
              ${state.cart.length === 0 ? `
                <div class="palm-card rounded-3xl p-8 text-center">
                  <h2 class="text-xl font-extrabold text-[#1A3C2F]">${t.emptyTitle}</h2>
                  <p class="mt-2 text-sm text-[#4A6457]">${t.emptyDesc}</p>
                  <button data-nav="menu" class="palm-btn-gold mt-6 min-h-[46px] rounded-xl px-6 py-3 text-sm font-extrabold">${t.browse}</button>
                </div>` : `
                <div class="palm-card rounded-3xl p-5">
                  <div class="flex items-center justify-between pb-4 border-b border-[#1A3C2F]/10">
                    <span class="text-sm font-bold text-[#1A3C2F]">${t.estTitle}</span>
                    <span class="rounded-xl bg-[#1A3C2F] px-3 py-1.5 text-xs font-extrabold text-[#C9A227]">${t.estVal}</span>
                  </div>
                  <p class="mt-4 text-xs font-bold text-[#4A6457] mb-2.5">${t.orderType}</p>
                  <div class="grid grid-cols-2 gap-3">
                    <button data-otype="pickup" class="min-h-[50px] rounded-2xl text-sm font-extrabold ${state.orderType === 'pickup' ? 'palm-btn-gold' : 'bg-[#E6DEC8] text-[#2F4D3F]'}">${t.pickup}</button>
                    <button data-otype="delivery" class="min-h-[50px] rounded-2xl text-sm font-extrabold ${state.orderType === 'delivery' ? 'palm-btn-gold' : 'bg-[#E6DEC8] text-[#2F4D3F]'}">${t.delivery}</button>
                  </div>
                </div>
                <div class="palm-card rounded-3xl p-5">
                  <h2 class="text-base font-extrabold text-[#1A3C2F] mb-4">${t.items}</h2>
                  <ul class="divide-y divide-[#1A3C2F]/10">
                    ${state.cart.map(c => `
                      <li class="flex items-center justify-between gap-3 py-3">
                        <div>
                          <p class="text-sm font-extrabold text-[#1A3C2F]">${state.lang === 'ar' ? c.ar : c.en} ${c.temp ? `(${c.temp === 'hot' ? t.hot : t.cold})` : ''}</p>
                          <p class="text-xs text-[#546E61]">${c.price} ﷼</p>
                        </div>
                        <div class="flex items-center gap-3">
                          <div class="flex items-center rounded-xl bg-[#1A3C2F] p-1 text-[#F5F0E6]">
                            <button data-qty="${c.cartKey}:-1" class="h-8 w-8 rounded-lg">-</button>
                            <span class="w-7 text-center font-en text-xs font-extrabold text-[#C9A227]">${c.qty}</span>
                            <button data-qty="${c.cartKey}:1" class="h-8 w-8 rounded-lg">+</button>
                          </div>
                          <span class="font-en text-sm font-extrabold tabular-nums">${c.price * c.qty} ﷼</span>
                        </div>
                      </li>`).join('')}
                  </ul>
                </div>
                <div class="palm-card rounded-3xl p-5 space-y-4">
                  ${state.orderType === 'pickup' ? `
                    <div class="rounded-2xl bg-[#EAE2D0] p-4">
                      <p class="text-sm font-extrabold text-[#1A3C2F]">${t.pickupTitle}</p>
                      <p class="mt-1 text-xs text-[#3B594B]">${t.pickupDesc}</p>
                    </div>` : `
                    ${user ? `
                      <div class="rounded-2xl bg-[#EAE2D0] p-4 space-y-1 text-sm">
                        <p class="font-extrabold text-[#1A3C2F]">${t.savedDel}</p>
                        <p><strong>${t.name}:</strong> ${esc(user.name)}</p>
                        <p><strong>${t.phone}:</strong> <span dir="ltr">${esc(user.phone)}</span></p>
                        <p><strong>${t.address}:</strong> ${esc(user.address)}</p>
                      </div>` : `
                      <div class="space-y-3">
                        <h2 class="text-base font-extrabold">${t.guestDel}</h2>
                        <input id="g-name" value="${esc(state.guest.name)}" placeholder="${t.name}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                        <input id="g-phone" dir="ltr" value="${esc(state.guest.phone)}" placeholder="${t.phone}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                        <input id="g-addr" value="${esc(state.guest.address)}" placeholder="${t.address}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      </div>`}
                    <button id="share-loc-btn" class="palm-btn-forest w-full min-h-[48px] rounded-xl text-sm font-bold">${state.locLoading ? t.locating : t.shareLoc}</button>
                    ${state.locError ? `<p class="text-xs font-bold text-[#B42318]">${state.locError}</p>` : ''}
                    ${mapUrl ? `<div class="rounded-xl bg-[#DCE8DE] px-3.5 py-2.5 text-xs font-bold text-[#1A3C2F] flex justify-between"><span>${t.locSaved}</span><a href="${mapUrl}" target="_blank" class="underline">Google Maps</a></div>` : ''}
                  `}
                  <textarea id="order-notes" rows="2" placeholder="${t.notes}" class="w-full rounded-xl border border-[#1A3C2F]/20 bg-white p-3 text-sm">${esc(state.notes)}</textarea>
                </div>
                <div class="palm-card rounded-3xl p-5 space-y-3">
                  <div class="flex justify-between text-lg font-extrabold"><span>${t.total}</span><span class="font-en">${cartTotal} ﷼</span></div>
                  ${state.orderType === 'delivery' ? `<div class="rounded-xl bg-[#EAE2D0] px-3.5 py-2 text-xs font-bold">${t.cod}</div>` : ''}
                  <p class="text-xs text-[#4A6457]">${t.noPay}</p>
                  ${state.formError ? `<p class="rounded-xl bg-[#FEE4E2] px-3.5 py-2 text-xs font-bold text-[#912018]">${state.formError}</p>` : ''}
                  <a id="send-wa-link" href="${buildWaUrl()}" target="_blank" rel="noopener noreferrer" class="palm-btn-gold flex w-full min-h-[54px] items-center justify-center rounded-2xl text-base font-extrabold">${t.sendWa}</a>
                </div>`}
            </div>`;
        } else if (state.view === 'account') {
          bodyHtml = `
            <div class="mx-auto max-w-xl px-4 pt-6 pb-20 sm:px-6">
              <button data-nav="menu" class="min-h-[44px] rounded-xl bg-[#234A3B] px-4 py-2 text-sm font-bold text-[#F5F0E6]">${t.back}</button>
              ${user ? `
                <div class="palm-card mt-6 rounded-3xl p-6 space-y-4">
                  <h1 class="text-2xl font-extrabold">${t.welcome}: ${esc(user.name)}</h1>
                  <div class="rounded-2xl bg-[#EAE2D0] p-4 space-y-2 text-sm">
                    <p><strong>${t.phone}:</strong> <span dir="ltr">${esc(user.phone)}</span></p>
                    <p><strong>${t.address}:</strong> ${esc(user.address)}</p>
                  </div>
                  <button id="logout-btn" class="w-full min-h-[46px] rounded-xl bg-[#FEE4E2] text-sm font-extrabold text-[#912018]">${t.logout}</button>
                </div>` : `
                <div class="palm-card mt-6 rounded-3xl p-6">
                  <div class="grid grid-cols-2 gap-2 rounded-2xl bg-[#E6DEC8] p-1.5">
                    <button data-acctab="login" class="min-h-[44px] rounded-xl text-sm font-extrabold ${state.accTab === 'login' ? 'bg-[#1A3C2F] text-[#F5F0E6]' : ''}">${t.loginTab}</button>
                    <button data-acctab="register" class="min-h-[44px] rounded-xl text-sm font-extrabold ${state.accTab === 'register' ? 'bg-[#1A3C2F] text-[#F5F0E6]' : ''}">${t.regTab}</button>
                  </div>
                  ${state.accTab === 'login' ? `
                    <form id="login-form" class="mt-5 space-y-3">
                      <input id="l-phone" dir="ltr" placeholder="${t.phone}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      <input id="l-pass" type="password" placeholder="${t.pass}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      ${state.accError ? `<p class="text-xs font-bold text-[#912018]">${state.accError}</p>` : ''}
                      <button type="submit" class="palm-btn-gold w-full min-h-[48px] rounded-xl text-sm font-extrabold">${t.signIn}</button>
                    </form>` : `
                    <form id="reg-form" class="mt-5 space-y-3">
                      <input id="r-name" placeholder="${t.name}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      <input id="r-phone" dir="ltr" placeholder="${t.phone}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      <input id="r-pass" type="password" placeholder="${t.pass}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      <input id="r-addr" placeholder="${t.address}" class="h-12 w-full rounded-xl border border-[#1A3C2F]/20 bg-white px-3.5 text-sm" />
                      ${state.accError ? `<p class="text-xs font-bold text-[#912018]">${state.accError}</p>` : ''}
                      <button type="submit" class="palm-btn-gold w-full min-h-[48px] rounded-xl text-sm font-extrabold">${t.createAcc}</button>
                    </form>`}
                </div>`}
            </div>`;
        } else {
          bodyHtml = `
            <div class="mx-auto max-w-3xl px-4 pt-6 pb-20 sm:px-6 space-y-5">
              <div class="flex items-center justify-between">
                <button data-nav="menu" class="min-h-[44px] rounded-xl bg-[#234A3B] px-4 py-2 text-sm font-bold text-[#F5F0E6]">${t.back}</button>
                <h1 class="text-xl font-extrabold text-[#F5F0E6]">${t.infoTitle}</h1>
              </div>
              <div class="palm-card rounded-3xl p-5 space-y-3">
                <a href="${BUSINESS.mapsUrl}" target="_blank" class="palm-btn-gold flex w-full min-h-[48px] items-center justify-center rounded-xl text-sm font-extrabold">${t.openMaps}</a>
                <a href="tel:+${BUSINESS.whatsappNumber}" class="block rounded-xl bg-[#EAE2D0] p-3.5 text-sm font-bold" dir="ltr">${BUSINESS.phoneDisplay}</a>
                <a href="https://wa.me/${BUSINESS.whatsappNumber}" target="_blank" class="block rounded-xl bg-[#EAE2D0] p-3.5 text-sm font-bold" dir="ltr">WhatsApp: ${BUSINESS.phoneDisplay}</a>
                <a href="mailto:${BUSINESS.email}" class="block rounded-xl bg-[#EAE2D0] p-3.5 text-sm font-bold" dir="ltr">${BUSINESS.email}</a>
              </div>
              <div class="palm-card rounded-3xl p-5 grid grid-cols-3 gap-3 text-center">
                <a href="${BUSINESS.instagramUrl}" target="_blank" class="palm-btn-forest py-3 rounded-xl text-xs font-bold">Instagram</a>
                <a href="${BUSINESS.tiktokUrl}" target="_blank" class="palm-btn-forest py-3 rounded-xl text-xs font-bold">TikTok</a>
                <a href="${BUSINESS.snapchatUrl}" target="_blank" class="palm-btn-forest py-3 rounded-xl text-xs font-bold">Snapchat</a>
              </div>
            </div>`;
        }

        document.getElementById('app').innerHTML = `
          <header class="sticky top-0 z-30 h-16 bg-[#132D23]/95 backdrop-blur-md border-b border-[#C9A227]/25">
            <div class="mx-auto flex h-full max-w-6xl items-center justify-between px-4 sm:px-6">
              <button data-nav="menu" class="flex items-center gap-2.5">
                <img src="${BUSINESS.logoSrc}" alt="Palm Metric" class="h-10 w-10 rounded-xl bg-[#F5F0E6] object-cover p-0.5" />
                <span class="text-base sm:text-lg font-extrabold text-[#F5F0E6]">${t.brand}</span>
              </button>
              <div class="flex items-center gap-2">
                <button data-nav="info" class="min-h-[40px] rounded-xl border border-[#F5F0E6]/20 px-3 text-xs font-bold text-[#F5F0E6]">${t.info}</button>
                <button id="lang-btn" class="min-h-[40px] rounded-xl border border-[#C9A227]/40 px-3 text-xs font-bold text-[#C9A227]">${t.langBtn}</button>
                <button data-nav="account" class="min-h-[40px] rounded-xl px-3.5 text-xs font-bold ${user ? 'bg-[#F5F0E6] text-[#1A3C2F]' : 'palm-btn-gold'}">${user ? esc(user.name.split(' ')[0]) : t.login}</button>
              </div>
            </div>
          </header>
          <main class="flex-1">${bodyHtml}</main>
          ${state.view === 'menu' && cartCount > 0 ? `
            <div class="fixed bottom-4 inset-x-4 z-40 mx-auto max-w-xl">
              <button data-nav="checkout" class="palm-cart-bar flex w-full min-h-[58px] items-center justify-between rounded-2xl px-4 py-3 font-extrabold">
                <span class="rounded-xl bg-[#1A3C2F] px-3 py-1 text-sm text-[#C9A227]">${cartCount}</span>
                <span class="text-sm sm:text-base">${t.viewCart}</span>
                <span class="font-en text-base sm:text-lg">${cartTotal} ﷼</span>
              </button>
            </div>` : ''}
          <footer class="border-t border-[#C9A227]/20 bg-[#132D23] py-5 px-4 text-center text-xs text-[#F5F0E6]/70">${t.footer}</footer>
        `;

        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll('[data-nav]').forEach(el => {
          el.addEventListener('click', () => {
            state.view = el.getAttribute('data-nav');
            state.formError = '';
            state.accError = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          });
        });

        const langBtn = document.getElementById('lang-btn');
        if (langBtn) langBtn.addEventListener('click', () => {
          state.lang = state.lang === 'ar' ? 'en' : 'ar';
          save();
          render();
        });

        document.querySelectorAll('[data-cat]').forEach(el => {
          el.addEventListener('click', () => {
            state.cat = el.getAttribute('data-cat');
            render();
          });
        });

        document.querySelectorAll('[data-temp]').forEach(el => {
          el.addEventListener('click', () => {
            const [id, temp] = el.getAttribute('data-temp').split(':');
            state.temps[id] = temp;
            render();
          });
        });

        document.querySelectorAll('[data-add]').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.getAttribute('data-add');
            const item = MENU.find(m => m.id === id);
            if (!item) return;
            const temp = item.temp ? (state.temps[item.id] || 'hot') : undefined;
            const key = temp ? `${item.id}::${temp}` : item.id;
            const existing = state.cart.find(c => c.cartKey === key);
            if (existing) existing.qty += 1;
            else state.cart.push({ cartKey: key, id: item.id, ar: item.ar, en: item.en, price: item.price, qty: 1, temp });
            save();
            render();
          });
        });

        document.querySelectorAll('[data-qty]').forEach(el => {
          el.addEventListener('click', () => {
            const parts = el.getAttribute('data-qty').split(':');
            const delta = Number(parts.pop());
            const key = parts.join(':');
            state.cart = state.cart.map(c => c.cartKey === key ? { ...c, qty: c.qty + delta } : c).filter(c => c.qty > 0);
            save();
            render();
          });
        });

        document.querySelectorAll('[data-otype]').forEach(el => {
          el.addEventListener('click', () => {
            state.orderType = el.getAttribute('data-otype');
            state.formError = '';
            render();
          });
        });

        const gName = document.getElementById('g-name');
        const gPhone = document.getElementById('g-phone');
        const gAddr = document.getElementById('g-addr');
        const oNotes = document.getElementById('order-notes');
        const syncCheckoutUrl = () => {
          const wa = document.getElementById('send-wa-link');
          if (wa) wa.setAttribute('href', buildWaUrl());
        };
        if (gName) gName.addEventListener('input', e => { state.guest.name = e.target.value; syncCheckoutUrl(); });
        if (gPhone) gPhone.addEventListener('input', e => { state.guest.phone = e.target.value; syncCheckoutUrl(); });
        if (gAddr) gAddr.addEventListener('input', e => { state.guest.address = e.target.value; syncCheckoutUrl(); });
        if (oNotes) oNotes.addEventListener('input', e => { state.notes = e.target.value; syncCheckoutUrl(); });

        const locBtn = document.getElementById('share-loc-btn');
        if (locBtn) locBtn.addEventListener('click', () => {
          if (!navigator.geolocation) { state.locError = T[state.lang].locDenied; render(); return; }
          state.locLoading = true; state.locError = ''; render();
          navigator.geolocation.getCurrentPosition(pos => {
            state.loc = { lat: Number(pos.coords.latitude.toFixed(6)), lng: Number(pos.coords.longitude.toFixed(6)) };
            state.locLoading = false; render();
          }, () => {
            state.locError = T[state.lang].locDenied; state.locLoading = false; render();
          });
        });

        const waLink = document.getElementById('send-wa-link');
        if (waLink) waLink.addEventListener('click', (e) => {
          const user = getUser();
          const t = T[state.lang];
          if (state.orderType === 'delivery') {
            const n = user ? user.name : state.guest.name.trim();
            const p = user ? user.phone : state.guest.phone.trim();
            const a = user ? user.address : state.guest.address.trim();
            if (!n) { e.preventDefault(); state.formError = t.errName; render(); return; }
            if (!p) { e.preventDefault(); state.formError = t.errPhone; render(); return; }
            if (!a) { e.preventDefault(); state.formError = t.errAddr; render(); return; }
          }
          waLink.setAttribute('href', buildWaUrl());
        });

        document.querySelectorAll('[data-acctab]').forEach(el => {
          el.addEventListener('click', () => { state.accTab = el.getAttribute('data-acctab'); state.accError = ''; render(); });
        });

        const loginForm = document.getElementById('login-form');
        if (loginForm) loginForm.addEventListener('submit', e => {
          e.preventDefault();
          const p = document.getElementById('l-phone').value.trim();
          const pw = document.getElementById('l-pass').value.trim();
          const m = state.accounts.find(a => a.phone.replace(/\s+/g, '') === p.replace(/\s+/g, '') && a.password === pw);
          if (!m) { state.accError = T[state.lang].errCreds; render(); return; }
          state.sessionId = m.id; state.view = 'menu'; save(); render();
        });

        const regForm = document.getElementById('reg-form');
        if (regForm) regForm.addEventListener('submit', e => {
          e.preventDefault();
          const name = document.getElementById('r-name').value.trim();
          const phone = document.getElementById('r-phone').value.trim();
          const password = document.getElementById('r-pass').value.trim();
          const address = document.getElementById('r-addr').value.trim();
          if (!name || !phone || !password || !address) { state.accError = T[state.lang].errAll; render(); return; }
          if (state.accounts.some(a => a.phone.replace(/\s+/g, '') === phone.replace(/\s+/g, ''))) { state.accError = T[state.lang].errExists; render(); return; }
          const acc = { id: 'pm_' + Date.now(), name, phone, password, address };
          state.accounts.push(acc); state.sessionId = acc.id; state.view = 'menu'; save(); render();
        });

        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', () => { state.sessionId = null; save(); render(); });
      }

      render();
    })();
  </script>
</body>
</html>
